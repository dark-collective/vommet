name: _
publish_to: none
environment: 
  sdk: '>=3.6.0 <4.0.0'
workspace:
  - commet
  - tiamat
  - widgets/matrix_widget_api
  - widgets/calendar
dependencies:
  iso_duration: ^0.1.1
# Vommet: package:sqlite3 3.x bundles SQLite through build hooks; use the
# SQLite3 Multiple Ciphers build (no key is set: databases stay plaintext).
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
