<!doctype html>
<html><head><meta charset="utf-8"><title>dock smoke</title></head>
<body style="margin:0;background:#1d3557;color:#fff;font:32px -apple-system,sans-serif">
<div id="t" style="padding:24px">smoke</div>
<script>
window.loadId = Math.random().toString(36).slice(2);
window.ticks = 0;
setInterval(() => {
  ticks++;
  document.getElementById("t").textContent = "loadId " + loadId + " ticks " + ticks;
}, 100);
window.addEventListener("message", (e) => {
  if (e.source !== window.parent) {
    window.parent.postMessage({ action: "bad-source" }, "*");
    return;
  }
  if (e.data && e.data.action === "ping") {
    window.parent.postMessage({ action: "ack", loadId: loadId, n: e.data.n }, "*");
  }
});
// WebKit only enters full screen once its GPU process runs
// (WKFullScreenWindowController enterFullScreen); a real widget's video or
// canvas starts it, so this page draws with WebGL like one.
const c = document.createElement("canvas");
c.width = 64; c.height = 64;
document.body.appendChild(c);
const gl = c.getContext("webgl");
if (gl) { gl.clearColor(0, 0.6, 0.3, 1); gl.clear(gl.COLOR_BUFFER_BIT); }
// A real click (the harness posts one) asks for full screen, as a video's
// button would.
window.fsResult = "";
document.addEventListener("click", () => {
  document.documentElement.requestFullscreen().then(
    () => { window.fsResult = "ok"; },
    (e) => { window.fsResult = String(e); });
});
window.parent.postMessage({ action: "hello", loadId: loadId }, "*");
</script>
</body></html>
