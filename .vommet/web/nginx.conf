# Vommet web: static Flutter app. Every path that isn't a file falls back to
# index.html (client-side routes).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The image's /etc/nginx/mime.types (included in the http block) already
    # maps .wasm to application/wasm. Don't add a types {} block here: it
    # replaces the whole inherited map, and index.html then goes out as
    # application/octet-stream (browsers download it instead of opening it).

    # main.dart.js (13 MB) and CanvasKit (5-7 MB) shrink 3-4x: serve the .gz
    # copies the image build made, or compress on the fly for anything else.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types application/javascript text/javascript application/wasm application/json text/css image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    # Entry points and runtime config: always revalidate, so a new image or a
    # changed homeserver shows up on the next load.
    location ~ ^/(index\.html|flutter_service_worker\.js|flutter_bootstrap\.js|version\.json|manifest\.json|assets/assets/config/.*)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
