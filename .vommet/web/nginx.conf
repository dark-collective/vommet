# Vommet web: static Flutter app. Every path that isn't a file falls back to
# index.html (client-side routes).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The image's /etc/nginx/mime.types (included in the http block) already
    # maps .wasm to application/wasm. Don't add a types {} block at this level:
    # it replaces the whole inherited map, and index.html then goes out as
    # application/octet-stream (browsers download it instead of opening it).

    # main.dart.js/.wasm (10+ MB) and CanvasKit/skwasm (5-7 MB) shrink 3-4x:
    # serve the .gz copies the image build made, or compress on the fly.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types application/javascript text/javascript application/wasm application/json text/css image/svg+xml application/manifest+json font/ttf font/otf;

    # Every location includes vommet-headers.inc (add_header isn't inherited
    # by a location with its own): security headers, and (unless
    # VOMMET_CROSS_ORIGIN_ISOLATION=off) COOP same-origin + COEP
    # credentialless, which the wasm build's multi-threaded renderer (skwasm)
    # needs; without them it runs single-threaded.

    # Nothing is content-hashed (main.dart.js, main.dart.wasm, the loader keep
    # their names across releases): always revalidate (ETag, a 304 when
    # unchanged), so an upgraded image never serves a mix of old and new files.
    location / {
        include /etc/nginx/conf.d/vommet-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # ES modules (main.dart.mjs, skwasm) must carry a JavaScript type; older
    # mime.types files don't list .mjs. A types {} block is safe here: it
    # only covers this location.
    location ~ \.mjs$ {
        types { }
        default_type text/javascript;
        include /etc/nginx/conf.d/vommet-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
}
