name: android

# Signed arm64 release APK for testers. Heavy (Android SDK + NDK + a Rust
# cross-build), so it runs on main and on demand, not on every branch push.
# Signing: the fork's own key from repo secrets (ANDROID_KEY_STORE_B64,
# ANDROID_KEY_PASSWORD) via upstream's scripts/setup_android_release.dart, so
# successive builds install as updates. versionCode = run number, so each
# build is newer than the last.
on:
  push:
    # sync/testing: the upstream-sync candidate must build an APK before promotion.
    branches: [main, testing, sync/testing, 'ci/android*']
  workflow_dispatch:

# Same host as the voice bridge's live E2E harness; see build.yml.
concurrency:
  group: live-host
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.41.9
  PROJECT_PATH: commet
  ANDROID_HOME: /root/android-sdk
  ANDROID_SDK_ROOT: /root/android-sdk
  CMDLINE_TOOLS_ZIP: commandlinetools-linux-11076708_latest.zip

jobs:
  apk:
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl xz-utils git unzip zip build-essential clang lld llvm cmake ninja-build pkg-config \
            openjdk-17-jdk-headless

      - name: Cache Flutter, pub, Rust, Android SDK and Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/flutter
            ~/.pub-cache
            ~/.rustup
            ~/.cargo
            /root/android-sdk
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock', 'Cargo.lock', 'commet/android/**/*.gradle', 'commet/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            android-${{ env.FLUTTER_VERSION }}-

      - name: Install Flutter ${{ env.FLUTTER_VERSION }} (if not cached)
        run: |
          if [ ! -x "$HOME/flutter/bin/flutter" ]; then
            rm -rf "$HOME/flutter"
            curl -fsSL "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz" | tar -xJ -C "$HOME"
          fi
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          git config --global --add safe.directory '*'

      - name: Install Rust + Android target (if not cached)
        run: |
          if [ ! -x "$HOME/.cargo/bin/cargo" ]; then
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          "$HOME/.cargo/bin/rustup" target add aarch64-linux-android
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Gradle installs the platform, build-tools and NDK versions it needs on
      # first use, as long as the SDK licenses are accepted.
      - name: Install Android SDK command-line tools (if not cached)
        run: |
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL -o /tmp/clt.zip "https://dl.google.com/android/repository/$CMDLINE_TOOLS_ZIP"
            unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          # The runner shell uses pipefail: when sdkmanager stops reading,
          # `yes` dies of SIGPIPE (exit 141) and would fail the step.
          echo "accepting SDK licenses"
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          echo "installing platform-tools"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" >/dev/null
          echo "android sdk ready"

      - name: Configure Flutter
        run: |
          flutter config --no-analytics --android-sdk "$ANDROID_HOME"
          flutter --version

      - name: Code generation
        run: |
          cd $PROJECT_PATH
          dart run scripts/codegen.dart

      - name: Signing key
        env:
          KEY_B64: ${{ secrets.ANDROID_KEY_STORE_B64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd $PROJECT_PATH
          if [ -z "$KEY_B64" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::signing secrets missing"; exit 1
          fi
          dart run scripts/setup_android_release.dart --key_password "$KEY_PASSWORD" --key_b64 "$KEY_B64"

      - name: Build APK (arm64, release)
        run: |
          cd $PROJECT_PATH
          # --split-per-abi drops the 32-bit ARM and x86_64 copies of plugin
          # libraries (about half the APK). Flutter then sets versionCode to
          # 2000 + build number for arm64, still increasing per run.
          flutter build apk --release --target-platform android-arm64 --split-per-abi \
            --build-number=${{ github.run_number }} \
            --dart-define BUILD_MODE=release \
            --dart-define PLATFORM=android \
            --dart-define GIT_HASH=${{ github.sha }} \
            --dart-define VERSION_TAG=${{ github.ref_name }}.${{ github.run_number }} \
            --dart-define BUILD_DETAIL=ci \
            --dart-define ENABLE_GOOGLE_SERVICES=false \
            --dart-define BUILD_DATE=$(date +%s000)
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../vommet-android-arm64.apk
          rm -f android/key.jks android/key.properties
          ls -la ../vommet-android-arm64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: vommet-android-arm64
          path: vommet-android-arm64.apk
          retention-days: 30
