name: pr-github

# Pull request builds on the GitHub copy (2026-10-18). build.yml no longer
# builds pull requests here (~17 h a week of the main runner's single slot);
# instead this job, every 10 minutes on the light runner:
#   1. copies each open PR's head to github.com/dark-collective/vommet as the
#      TAG ci-pr-<number>: one parentless snapshot commit (no history, message
#      "Vommet pull request <n> snapshot of <sha>", as github-copy.yml does for
#      branches) whose .github/ holds ONLY vommet-pr.yml from ci/windows-release;
#      GitHub runs that workflow (format, codegen, analyze, unit tests, Linux
#      release build) with no secrets and a read-only token;
#   2. mirrors the GitHub result onto the PR head as the commit status
#      "build / linux (github)" (pending while it builds), with the failing
#      lines from the run's annotations in the description;
#   3. deletes the tags of PRs that are no longer open.
#   3b. (2026-11-04) for PRs whose author is listed in .vommet/ci/integration-pr-authors
#      on main (the AI agent accounts), once "build / linux (github)" is green on
#      the head: the same snapshot with vommet-integration.yml instead, as the tag
#      ci-prit-<number>, mirrored as "integration / pr (github)". The full
#      integration suite (~20 min, throwaway homeserver inside the job) so the
#      agent sees a red integration test before the maintainer's intake does. At
#      most MAX_ACTIVE_IT integration runs of ANY kind at a time; while a cut's,
#      pre-gate's or intake's integration run (any vommet-integration run that
#      isn't a ci-prit-* copy) or a release build (any other workflow but vommet-pr
#      and vommet-gate) is active, at most MAX_ACTIVE_IT_BUSY, so those runs are
#      never kept waiting by PR copies (11-06: 4 when idle, 2 as before when busy).
#      (11-06, Vommet issue 1191) main has no integration harness (it lives in the
#      testing stack), so a main-based head without .vommet/it/run.sh is merged
#      into testing with its canonical merge base, git objects only; a head that
#      carries the harness is tested as it is. .vommet/ci/pr-integration-tree.sh
#      (this workflow's own commit, run with no tokens in its environment) builds
#      the tree and checks it holds the executable runner and the entry point;
#      a conflict or an incomplete tree posts a failure and enqueues nothing.
#      The snapshot message and the statuses name the head, the testing commit
#      and the merge base. See .vommet/ci/pr-integration-tree.md, whose tests
#      run in every PR build (vommet-pr.yml, checks).
#   4. cancels Forgejo build.yml pull_request runs that are still WAITING for
#      a runner when GitHub already builds their exact commit. PR branches
#      based on an older main carry a build.yml that still builds pull
#      requests here, and a burst of them blocked a cut's sync/main build for
#      hours (2026-10-18; operator: new PR builds go to GitHub and must stop
#      blocking). Running jobs and every other workflow/event are left alone.
# A tag, not a branch: github-copy.yml deletes every GitHub branch that isn't
# one of its snapshots, and older copies of it live on other branches.
#
# PR code is untrusted, and this job holds GH_COPY_TOKEN, so it never checks
# out, builds or runs anything from a PR: it reads PR trees as git objects
# (fetch, ls-tree, mktree) and only ever pushes. The workflow GitHub runs is
# always ours, never the PR's. Fork PRs are copied only when their author has
# write access to nether/vommet (and owns the fork), or once someone with
# write access adds the label "ci-approved", or when their author is listed
# in .vommet/ci/trusted-pr-authors on main (one login per line; CI only, no
# push or merge rights). Fork PRs from anyone else are left alone. Same-repo
# PRs come from people who can push here anyway.
#
# Unit gates (2026-10-18, operator: Option A of the stage-gates proposal):
# sessions push a merged check tree as the Forgejo branch gate/<name>
# (vommet-tools/gate.sh), optionally with .vommet/ci/gate-files, and dispatch
# this workflow with input gate=<name> (or wait for the next 10-minute run).
# It is copied the same way, as the tag ci-gate-<name> carrying vommet-gate.yml
# (format, pub get, codegen, analyze, unit tests; TEMPLATE.sh's steps), and the
# result lands on the gate commit as "gate / unit (github)". Gate branches and
# their tags are deleted 3 days after their last commit. Gate branches come
# from people who can push here, like same-repo PRs.
#
# GitHub runs 20 jobs at once for the whole account, shared with the release
# builds (a cut queues ~45 jobs and fills the account by itself, 11-06): at
# most MAX_ACTIVE PR + gate + PR integration jobs run at a time. PR
# builds use at most MAX_ACTIVE_PR slots and unit gates use at most
# MAX_ACTIVE_GATE. Gates go first without consuming the slots reserved for PRs.
# The caps count JOBS (11-06): a PR build run is 2 parallel jobs (checks,
# bundle), a PR integration run 2 shards, a gate 1. MAX_ACTIVE_IT counts runs;
# a raised MAX_ACTIVE_IT never raises the job budget, MAX_ACTIVE still applies.
#
# Scheduled workflows run from main only; workflow_dispatch works from any
# branch (trial runs: input "only" = one PR number, or "gate" = one gate).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Only this PR number (empty: all open PRs)'
        default: ''
      gate:
        description: 'Only this gate (branch gate/<name>); skips PRs and pruning'
        default: ''
      it_authors:
        description: 'Trial only: integration-suite authors instead of main''s list (comma-separated)'
        default: ''
      retest:
        description: 'yes, with only: run that PR''s integration suite again on the same head (after a CI repair; the new run sets the status)'
        default: ''

concurrency:
  group: pr-github
  cancel-in-progress: false

env:
  GH_TOKEN_COPY: ${{ secrets.GH_COPY_TOKEN }}
  FJ_TOKEN: ${{ secrets.SYNC_TOKEN }}
  SRC: ${{ github.server_url }}/${{ github.repository }}.git
  API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
  DEST: github.com/dark-collective/vommet.git
  GH_API: https://api.github.com/repos/dark-collective/vommet
  ONLY: ${{ inputs.only || '' }}
  GATE: ${{ inputs.gate || '' }}
  IT_AUTHORS: ${{ inputs.it_authors || '' }}
  RETEST: ${{ inputs.retest || '' }}
  # A pending status with no finished GitHub run after this long becomes an error.
  STALE_MIN: 180
  # PR copies per run (most recently updated PRs first); concurrency caps above.
  MAX_COPIES: 3
  MAX_ACTIVE: 12
  MAX_ACTIVE_PR: 6
  MAX_ACTIVE_GATE: 6
  MAX_ACTIVE_IT: 4
  # ... while a cut's, pre-gate's or intake's integration run or a release build is active (header, 3b).
  MAX_ACTIVE_IT_BUSY: 2
  # Jobs per run, for the job caps above: vommet-pr.yml parts, vommet-integration.yml shards.
  JOBS_PR: 2
  JOBS_PRIT: 2
  GATE_DAYS: 3

jobs:
  sync:
    runs-on: light
    timeout-minutes: 20
    steps:
      - name: Install tools
        run: |
          command -v jq >/dev/null && exit 0
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends curl ca-certificates jq git >/dev/null

      # Forgejo over the tailnet when it answers there: no Cloudflare 100 s cap, ~2 ms API calls
      # instead of 0.1-0.4 s (2026-11-05). Same check as .vommet/ci/forgejo-tailnet.sh, inline
      # because this job has no checkout.
      - name: Forgejo over the tailnet
        id: forgejo
        shell: bash
        run: |
          T=http://100.64.0.13:3000
          if [ "$(curl -s -m 5 -o /dev/null -w '%{http_code}' "$T/api/v1/version" || true)" = 200 ]; then
            b=$T; echo "Forgejo over the tailnet: $T"
          else
            b=${GITHUB_SERVER_URL%/}; echo "Forgejo through $b"
          fi
          { echo "server=$b"; echo "src=$b/$GITHUB_REPOSITORY.git"; echo "api=$b/api/v1/repos/$GITHUB_REPOSITORY"; } >> "$GITHUB_OUTPUT"

      - name: Copy PR heads and gates, mirror results, prune
        shell: bash
        env:
          FJ_SERVER: ${{ steps.forgejo.outputs.server || github.server_url }}
          SRC: ${{ steps.forgejo.outputs.src || env.SRC }}
          API: ${{ steps.forgejo.outputs.api || env.API }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN_COPY:-}" ] || [ -z "${FJ_TOKEN:-}" ]; then
            echo "GH_COPY_TOKEN or SYNC_TOKEN not set; skipping"; exit 0
          fi
          [[ -z $GATE || $GATE =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]] || { echo "::error::bad gate name"; exit 1; }
          [[ -z $ONLY || $ONLY =~ ^[0-9]+$ ]] || { echo "::error::bad PR number"; exit 1; }
          [[ -z $RETEST || ( $RETEST = yes && -n $ONLY ) ]] || { echo "::error::retest takes yes, with only=<PR>"; exit 1; }
          # The Forgejo token never goes in argv or a URL (both show in ps on the runner host):
          # curl reads it from a private file, git from the environment.
          fjh=$(mktemp); trap 'rm -f "$fjh"' EXIT
          printf 'Authorization: token %s\n' "$FJ_TOKEN" > "$fjh"
          fj() { curl -fsS -m 60 -H @"$fjh" "$@"; }
          fjgit() {
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.${FJ_SERVER%/}/.extraheader" \
              GIT_CONFIG_VALUE_0="Authorization: Basic $(printf 'x:%s' "$FJ_TOKEN" | base64 -w0)" git "$@"
          }
          post() {  # sha context state description target_url
            local d=${4:0:240}
            fj -o /dev/null -X POST -H 'Content-Type: application/json' \
              -d "$(jq -n --arg c "$2" --arg s "$3" --arg d "$d" --arg u "$5" \
                    '{state:$s,context:$c,description:$d,target_url:$u}')" "$API/statuses/$1" \
              && echo "  $2: $3 $d" || echo "::warning::could not post the status on $1"
          }
          url="https://x-access-token:${GH_TOKEN_COPY}@${DEST}"
          export GIT_AUTHOR_NAME='Vommet snapshot' GIT_AUTHOR_EMAIL='snapshot@nether.codes'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          git init -q w && cd w

          # Our .github/ for every snapshot: ONE workflow, from ci/windows-release.
          git fetch -q --depth=1 --no-tags "$SRC" +refs/heads/ci/windows-release:refs/trusted
          # Fork PR authors whose PRs build without the label, read from main (never from a PR).
          git fetch -q --depth=1 --no-tags "$SRC" +refs/heads/main:refs/main
          # The integration-tree helper comes from this workflow's own commit (main when
          # scheduled; a dispatch's branch is chosen by a repo writer), never from a PR. Loaded
          # for the first integration copy; when it can't be, those copies wait and the job fails.
          ithelper=$(mktemp); trap 'rm -f "$fjh" "$ithelper" "$ithelper.why"' EXIT
          it_broken=
          load_ithelper() {
            [ -s "$ithelper" ] && return 0
            [ -z "$it_broken" ] || return 1
            if git fetch -q --depth=1 --no-tags "$SRC" "$GITHUB_SHA" \
                && git show "$GITHUB_SHA:.vommet/ci/pr-integration-tree.sh" > "$ithelper" && [ -s "$ithelper" ]; then return 0; fi
            it_broken="no .vommet/ci/pr-integration-tree.sh from $GITHUB_SHA; PR integration copies wait"
            echo "::error::$it_broken"; return 1
          }
          declare -A TRUSTED=()
          while read -r u; do
            [[ $u =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]] && TRUSTED[$u]=1
          done < <(git show refs/main:.vommet/ci/trusted-pr-authors 2>/dev/null | sed 's/#.*//' || true)
          # Authors whose PRs also get the integration suite (3b), read from main.
          # A dispatch may pass it_authors for a trial (only repo writers can dispatch).
          itu=$( { if [ -n "${IT_AUTHORS:-}" ]; then tr ', ' '\n\n' <<<"$IT_AUTHORS"
                   else git show refs/main:.vommet/ci/integration-pr-authors 2>/dev/null || true; fi; } \
            | sed 's/#.*//' | { grep -E '^[A-Za-z0-9][A-Za-z0-9_.-]*$' || true; } | jq -R . | jq -sc .)
          [[ $itu == \[* ]] || itu='[]'
          declare -A GHDIR=()
          for f in vommet-pr.yml vommet-gate.yml vommet-integration.yml; do
            blob=$(git rev-parse "refs/trusted:.github/workflows/$f")
            wf=$(printf '100644 blob %s\t%s\n' "$blob" "$f" | git mktree)
            GHDIR[$f]=$(printf '040000 tree %s\tworkflows\n' "$wf" | git mktree)
          done

          # Work items, gates first: kind key sha ref tag workflow context fork ok user owner
          items='[]'
          if [ -z "$ONLY" ]; then
            while read -r sha ref; do
              name=${ref#refs/heads/gate/}
              [[ $sha =~ ^[0-9a-f]{40}$ && $name =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]] || { echo "::warning::ignoring branch $ref (name must be [a-z0-9-])"; continue; }
              [ -z "$GATE" ] || [ "$GATE" = "$name" ] || continue
              items=$(jq -c --arg k "$name" --arg s "$sha" '. + [{kind:"gate", key:$k, sha:$s,
                ref:("refs/heads/gate/" + $k), tag:("ci-gate-" + $k), wf:"vommet-gate.yml", ctx:"gate / unit (github)",
                fork:false, ok:true, user:"", owner:""}]' <<<"$items")
            done < <(git ls-remote --heads "$SRC" 'refs/heads/gate/*')
          fi
          if [ -z "$GATE" ]; then
            for page in 1 2 3 4 5 6; do
              p=$(fj "$API/pulls?state=open&sort=recentupdate&limit=50&page=$page")
              items=$(jq -c --argjson a "$items" '$a + [.[] | {kind:"pr", key:(.number|tostring), sha:.head.sha,
                      ref:("refs/pull/" + (.number|tostring) + "/head"), tag:("ci-pr-" + (.number|tostring)),
                      wf:"vommet-pr.yml", ctx:"build / linux (github)",
                      fork:((.head.repo.full_name // "") != (.base.repo.full_name // "")),
                      ok:(any(.labels[]?; .name == "ci-approved")),
                      user:.user.login, owner:(.head.repo.owner.login // "")}]
                      + [.[] | select(.user.login as $u | $itu | index($u)) | {kind:"prit", key:(.number|tostring), sha:.head.sha,
                      ref:("refs/pull/" + (.number|tostring) + "/head"), tag:("ci-prit-" + (.number|tostring)),
                      wf:"vommet-integration.yml", ctx:"integration / pr (github)",
                      base:(.merge_base // ""), base_ref:.base.ref,
                      fork:((.head.repo.full_name // "") != (.base.repo.full_name // "")),
                      ok:(any(.labels[]?; .name == "ci-approved")),
                      user:.user.login, owner:(.head.repo.owner.login // "")}]' --argjson itu "$itu" <<<"$p")
              [ "$(jq length <<<"$p")" -lt 50 ] && break
            done
          fi
          echo "$(jq '[.[]|select(.kind=="gate")]|length' <<<"$items") gate(s), $(jq '[.[]|select(.kind=="pr")]|length' <<<"$items") open PR(s)"
          # Recent GitHub runs, one anonymous request (public repo; 60/h per IP).
          all_runs=$(curl -fsS -m 60 "$GH_API/actions/runs?event=push&per_page=100" 2>/dev/null || echo null)
          runs=$(jq -c '[.workflow_runs[]? | select(.name == "vommet-pr" or .name == "vommet-gate" or .name == "vommet-integration")
                      | {id, name, status, conclusion, html_url, b:.head_branch, hs:.head_sha, msg:.head_commit.message}]' <<<"$all_runs" 2>/dev/null || echo null)
          [ "$all_runs" != null ] || runs=null
          # release builds of a cut (vommet-linux, -web-e2e, -native, ...): every other workflow, unfinished
          release_runs=$(jq -c '[.workflow_runs[]? | select(.status != "completed" and .name != "vommet-pr" and .name != "vommet-gate" and .name != "vommet-integration")
                      | {name, b:.head_branch}]' <<<"$all_runs" 2>/dev/null || echo '[]')
          [ "$runs" != null ] || echo "::warning::GitHub runs list unavailable this time; results are mirrored next run"

          declare -A writer=()
          can_write() {  # login -> 0 when write/admin/owner on this repo
            local u=$1
            if [ -z "${writer[$u]+x}" ]; then
              writer[$u]=$(fj "$API/collaborators/$u/permission" 2>/dev/null | jq -r '.permission // "none"' || echo none)
            fi
            case ${writer[$u]} in write|admin|owner) return 0;; *) return 1;; esac
          }

          # capacity accounting (begin; pr-integration-tree-test.py runs this part as it is)
          active=0 active_pr=0 active_it=0 active_prit=0 active_other_it=0
          if [ "$runs" != null ]; then
            # ours = PR builds, gates and PR integration copies; the cut's and pre-gate's integration runs only count for MAX_ACTIVE_IT
            # in jobs (JOBS_PR / JOBS_PRIT per PR run, 1 per gate), except active_it (runs)
            active=$(jq --argjson p "$JOBS_PR" --argjson i "$JOBS_PRIT" '[.[] | select(.status != "completed" and (.name != "vommet-integration" or (.b | startswith("ci-prit-"))))
                       | if .name == "vommet-pr" then $p elif .name == "vommet-integration" then $i else 1 end] | add // 0' <<<"$runs")
            active_pr=$(jq --argjson p "$JOBS_PR" '[.[] | select(.status != "completed" and .name == "vommet-pr")] | length * $p' <<<"$runs")
            active_it=$(jq '[.[] | select(.status != "completed" and .name == "vommet-integration")] | length' <<<"$runs")
            active_prit=$(jq --argjson i "$JOBS_PRIT" '[.[] | select(.status != "completed" and .name == "vommet-integration" and (.b | startswith("ci-prit-")))] | length * $i' <<<"$runs")
            # cut, pre-gate and intake integration runs (runs, not jobs) and a cut's release builds:
            # PR integration copies drop to MAX_ACTIVE_IT_BUSY
            active_other_it=$(jq '[.[] | select(.status != "completed" and .name == "vommet-integration" and (.b | startswith("ci-prit-") | not))] | length' <<<"$runs")
            active_release=$(jq 'length' <<<"$release_runs")
          fi
          it_cap=$MAX_ACTIVE_IT; [ "$active_other_it" -eq 0 ] && [ "${active_release:-0}" -eq 0 ] || it_cap=$MAX_ACTIVE_IT_BUSY
          # capacity accounting (end)
          copies=0 copies_pr=0 copies_it=0
          while read -r row; do
            kind=$(jq -r .kind <<<"$row"); key=$(jq -r .key <<<"$row"); sha=$(jq -r .sha <<<"$row")
            ref=$(jq -r .ref <<<"$row"); tag=$(jq -r .tag <<<"$row"); wfile=$(jq -r .wf <<<"$row"); ctx=$(jq -r .ctx <<<"$row")
            [[ $sha =~ ^[0-9a-f]{40}$ && $key =~ ^[a-z0-9-]+$ ]] || { echo "::warning::skipping malformed entry"; continue; }
            [ -z "$ONLY" ] || [ "$ONLY" = "$key" ] || continue
            what="$kind $key ${sha:0:8}"
            st=$(fj "$API/commits/$sha/status" | jq -c --arg c "$ctx" '[.statuses[]? | select(.context == $c)] | max_by(.id) // {}') \
              || { echo "::warning::$what: status lookup failed"; continue; }
            state=$(jq -r '.status // "none"' <<<"$st")
            # A writer's dispatch (retest=yes, only=<PR>) runs a finished integration gate again,
            # e.g. after a CI repair; the status then comes from that new run, never from here.
            if [ "$RETEST" = yes ] && [ "$kind" = prit ] && [ "$state" != pending ]; then
              echo "$what: retest requested (was $state)"; state=none
            fi
            # retest (end)
            case $state in
              success|failure|error) continue ;;
              pending)
                [ "$runs" != null ] || continue
                # The run of the snapshot the pending status names (11-06); older statuses: by message.
                snapsha=$(jq -r '.description // ""' <<<"$st" | grep -oE 'snapshot [0-9a-f]{40}' | cut -c10- || true)
                r=$(jq -c --arg b "$tag" --arg s "$sha" --arg n "$snapsha" \
                  '[.[] | select(.b == $b and (if $n != "" then .hs == $n else (.msg | contains($s)) end))] | max_by(.id) // empty' <<<"$runs")
                if [ -n "$r" ] && [ "$(jq -r .status <<<"$r")" = completed ]; then
                  id=$(jq -r .id <<<"$r"); c=$(jq -r .conclusion <<<"$r"); u=$(jq -r .html_url <<<"$r")
                  # A head tested on the testing stack says so in its result, too.
                  on=$(jq -r .msg <<<"$r" | grep -oE 'on testing [0-9a-f]{12}' | head -n1 || true)
                  echo "$what: GitHub run $id $c${on:+ ($on)}"
                  if [ "$c" = success ]; then post "$sha" "$ctx" success "GitHub run $id${on:+ ($on)}" "$u"
                  else
                    why=$(curl -fsS -m 60 "$GH_API/actions/runs/$id/jobs" 2>/dev/null \
                      | jq -r '[.jobs[] | select(.conclusion != "success" and .conclusion != "skipped") | .id][0] // empty' || true)
                    [ -z "$why" ] || why=$(curl -fsS -m 60 "$GH_API/check-runs/$why/annotations" 2>/dev/null \
                      | jq -r '[.[] | select(.annotation_level == "failure" and (.message | startswith("Process completed") | not)) | (.title + ": " + .message)][0] // ""' | tr '\n' ' ' || true)
                    post "$sha" "$ctx" failure "GitHub run $id $c${on:+ ($on)}${why:+: $why}" "$u"
                  fi
                elif [ -z "$r" ]; then
                  age=$(( ( $(date +%s) - $(date -d "$(jq -r .updated_at <<<"$st")" +%s) ) / 60 ))
                  if [ "$age" -ge "$STALE_MIN" ]; then post "$sha" "$ctx" error "no GitHub run after $age min" ""; fi
                fi
                continue ;;
            esac

            # Not copied yet. Fork PRs need a trusted author or the ci-approved label.
            if [ "$(jq -r .fork <<<"$row")" = true ] && [ "$(jq -r .ok <<<"$row")" != true ]; then
              user=$(jq -r .user <<<"$row"); owner=$(jq -r .owner <<<"$row")
              if ! { [ "$user" = "$owner" ] && { [ -n "${TRUSTED[$user]+x}" ] || can_write "$user"; }; }; then
                echo "$what: fork PR by $user without write access, trusted-pr-authors entry or ci-approved label; not copied"; continue
              fi
            fi
            if [ "$runs" = null ]; then
              echo "$what: waiting (GitHub capacity unavailable)"; continue
            fi
            if [ "$kind" = prit ]; then
              # integration only on top of a green build of the same head, and only when GitHub has room
              b=$(fj "$API/commits/$sha/status" | jq -r '[.statuses[]? | select(.context == "build / linux (github)")] | max_by(.id) | .status // "none"') || continue
              [ "$b" = success ] || { echo "$what: integration waits for a green build ($b)"; continue; }
              [ "$runs" != null ] || continue
              # integration cap (begin)
              if [ "$((active_it + copies_it))" -ge "$it_cap" ]; then
                echo "$what: integration waiting ($active_it integration runs active, $active_other_it of them cut/pre-gate/intake, ${active_release:-0} release runs; cap $it_cap)"; continue
              fi
              # integration cap (end)
            fi
            case $kind in pr) w=$JOBS_PR;; prit) w=$JOBS_PRIT;; *) w=1;; esac
            if [ "$((active + copies + w))" -gt "$MAX_ACTIVE" ] || { [ "$kind" = pr ] && \
                 { [ "$copies_pr" -ge "$MAX_COPIES" ] || [ "$((active_pr + copies_pr * JOBS_PR + JOBS_PR))" -gt "$MAX_ACTIVE_PR" ]; }; }; then
              echo "$what: waiting (GitHub busy: $active active, $copies copied this run)"; continue
            fi
            if [ "$kind" = gate ] && [ "$((active - active_pr - active_prit + copies - copies_pr * JOBS_PR - copies_it * JOBS_PRIT))" -ge "$MAX_ACTIVE_GATE" ]; then
              echo "$what: waiting (unit gate slots full; reserving capacity for PRs)"; continue
            fi
            git fetch -q --depth=1 --no-tags "$SRC" "+$ref:refs/item/$tag" || { echo "::warning::$what: fetch failed"; continue; }
            [ "$(git rev-parse "refs/item/$tag")" = "$sha" ] || { echo "$what moved while fetching; next run"; continue; }
            # snapshot tree (begin; pr-integration-tree-test.py runs this part as it is)
            source_tree=$sha stack= base= on=
            if [ "$kind" = prit ]; then
              # Integration: the head's own tree when it carries the harness, else (a main-based
              # head; main has no harness) the head merged into testing with its canonical merge
              # base. This workflow commit's helper decides and checks the tree, with no tokens in its env.
              stack=- base=-
              if ! git cat-file -e "$sha:.vommet/it/run.sh" 2>/dev/null; then
                base=$(jq -r '.base // ""' <<<"$row")
                if [ "$(jq -r '.base_ref // ""' <<<"$row")" != main ] || ! [[ $base =~ ^[0-9a-f]{40}$ ]]; then
                  post "$sha" "$ctx" failure "integration not started: the head has no .vommet/it/run.sh and isn't based on main" ""; continue
                fi
                git fetch -q --depth=1 --no-tags "$SRC" +refs/heads/testing:refs/it-testing \
                  || { echo "::warning::$what: fetching testing failed; next run"; continue; }
                # (once more after a pause: only a missing commit, not a blip, may fail the head)
                git fetch -q --depth=1 --no-tags "$SRC" "$base" || { sleep 10; git fetch -q --depth=1 --no-tags "$SRC" "$base"; } || {
                  post "$sha" "$ctx" failure "integration not started: merge base ${base:0:12} is not on the server; rebase onto the current main" ""; continue; }
                stack=$(git rev-parse refs/it-testing)
              fi
              load_ithelper || continue
              if ! prepared=$(env -i PATH="$PATH" HOME="$HOME" LC_ALL=C bash "$ithelper" "$sha" "$base" "$stack" 2>"$ithelper.why"); then
                why=$(tail -n1 "$ithelper.why"); cat "$ithelper.why"
                post "$sha" "$ctx" failure "integration not started: ${why:-integration tree check failed}" ""; continue
              fi
              read -r source_tree stack <<<"$prepared"
              [[ $source_tree =~ ^[0-9a-f]{40}$ ]] || { post "$sha" "$ctx" failure "integration not started: bad tree from the helper" ""; continue; }
              if [ "$stack" = - ]; then stack=; else on="on testing ${stack:0:12}"; fi
              echo "$what: integration tree $source_tree${stack:+ = head on testing $stack (merge base $base)}"
            fi
            # The tested tree minus its .github/, plus the trusted workflow.
            tree=$( { git ls-tree "$source_tree" | grep -v -P '\t\.github$' || true; printf '040000 tree %s\t.github\n' "${GHDIR[$wfile]}"; } | git mktree)
            # snapshot tree (end)
            date=$(git log -1 --format=%cd --date=raw "$sha")
            case $kind in
              pr) msg="Vommet pull request $key snapshot of $sha";;
              prit) msg="Vommet pull request $key integration snapshot of $sha${stack:+ on testing $stack (merge base $base)}"
                    # a retest is a new commit (same tree), so GitHub runs it again
                    [ "$RETEST" != yes ] || msg="$msg, retest ${GITHUB_RUN_ID:-$(date +%s)}";;
              *) msg="Vommet gate $key snapshot of $sha";;
            esac
            if grep -Eq '#[0-9]|[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+#|GH-[0-9]' <<<"$msg"; then echo "::error::issue-linking message"; exit 1; fi
            snap=$(GIT_AUTHOR_DATE="$date" GIT_COMMITTER_DATE="$date" git -c commit.gpgsign=false commit-tree "$tree" -m "$msg")
            [ "$(git rev-list --count "$snap")" = 1 ] || { echo "::error::snapshot is not a single orphan commit"; exit 1; }
            git push -q --force "$url" "$snap:refs/tags/$tag"
            echo "$what: copied as $tag (${snap:0:8})"
            copies=$((copies + w))
            case $kind in pr) copies_pr=$((copies_pr + 1));; prit) copies_it=$((copies_it + 1));; esac
            post "$sha" "$ctx" pending "running on the GitHub copy, snapshot $snap${on:+ ($on)}" \
              "https://github.com/dark-collective/vommet/actions/workflows/$wfile?query=branch%3A$tag"
          # Gates, then PR integration copies (only those on a green build go), then PR builds: a PR
          # that is halfway through gets the next free slots before a new PR build takes them.
          done < <(jq -c '(map(select(.kind == "gate")) + map(select(.kind == "prit")) + map(select(.kind == "pr")))[]' <<<"$items")

          # Waiting Forgejo PR builds of commits GitHub already builds (see 4. above).
          fj "$API/actions/runs?status=waiting&limit=100" 2>/dev/null \
            | jq -r '.workflow_runs[]? | select(.workflow_id == "build.yml" and (.event | startswith("pull_request")))
                     | [.id, .prettyref, .commit_sha] | @tsv' \
            | while IFS=$'\t' read -r rid pr csha; do
                [[ $rid =~ ^[0-9]+$ && $csha =~ ^[0-9a-f]{40}$ ]] || continue
                [ -z "$ONLY" ] || [ "$pr" = "#$ONLY" ] || continue
                has=$(fj "$API/commits/$csha/status" | jq -r '[.statuses[]? | select(.context == "build / linux (github)")] | length' || echo 0)
                [ "${has:-0}" -gt 0 ] || continue
                if fj -o /dev/null -X POST "$API/actions/runs/$rid/cancel"; then
                  echo "PR ${pr#\#} ${csha:0:8}: cancelled waiting Forgejo build run $rid (built on GitHub)"
                else echo "::warning::could not cancel Forgejo run $rid"; fi
              done || true

          # A missing helper fails the job (after everything else ran), so it is seen.
          rc=0; [ -z "$it_broken" ] || { echo "::error::$it_broken"; rc=1; }
          # Pruning: scheduled/full runs only.
          [ -z "$ONLY$GATE" ] || exit $rc
          # Gate branches GATE_DAYS after their last commit.
          old=""
          for k in $(jq -r '.[] | select(.kind == "gate") | .key' <<<"$items"); do
            ts=$(fj "$API/branches/gate%2F$k" 2>/dev/null | jq -r '.commit.timestamp // empty') || continue
            [ -n "$ts" ] || continue
            if [ $(( $(date +%s) - $(date -d "$ts" +%s) )) -gt $((GATE_DAYS * 86400)) ]; then old="$old $k"; fi
          done
          if [ -n "$old" ]; then
            echo "deleting gate branch(es) older than $GATE_DAYS days:$old"
            fjgit push -q "$SRC" --delete $(for k in $old; do echo "refs/heads/gate/$k"; done) || echo "::warning::could not delete old gate branches"
          fi
          # Tags whose PR is closed or whose gate branch is gone.
          keep=$(jq -r '.[].tag' <<<"$items" | sort -u)
          for k in $old; do keep=$(grep -vx "ci-gate-$k" <<<"$keep" || true); done
          gone=$(git ls-remote --tags "$url" 'refs/tags/ci-pr-*' 'refs/tags/ci-prit-*' 'refs/tags/ci-gate-*' | cut -f2 | while read -r t; do
            grep -qx "${t#refs/tags/}" <<<"$keep" || echo "$t"; done)
          if [ -n "$gone" ]; then
            echo "deleting $(wc -l <<<"$gone") tag(s) of closed PRs / finished gates"; git push -q "$url" --delete $gone
          fi
          exit $rc
