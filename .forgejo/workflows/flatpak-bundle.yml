name: flatpak-bundle

# Linux bundle built with BUILD_DETAIL=flatpak, for wrapping into a .flatpak
# (commet/linux/flatpak/im.nether.chat.yaml). The flag changes runtime
# behaviour (process spawning, widget runner, shortcuts), so the regular
# Linux bundle can't be reused. Wrapping needs flatpak-builder's sandbox,
# which the runner's job containers can't provide; done on a host that can.
#
# Derived from build.yml (same toolchain setup and cache).
on:
  push:
    # sync/testing: the candidate's run provides the release bundle.
    branches: [testing, sync/testing, 'ci/flatpak*']
  workflow_dispatch:

# Shares the runner host with the voice bridge's live E2E harness; a Flutter +
# Rust build alongside an audio scenario garbles its timing scores, so serialize
# on the same fixed group nether-voicebridge uses.
concurrency:
  group: live-host
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.41.9
  PROJECT_PATH: commet

jobs:
  # Skip the heavy job when this commit (or the green testing that contains
  # it) already passed it, e.g. testing/main/topics right after a promote.
  check:
    runs-on: docker
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        env:
          TOKEN: ${{ github.token }}
        run: |
          if [ -x .vommet/ci/already-passed.sh ]; then .vommet/ci/already-passed.sh "flatpak-bundle / linux"
          else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

  linux:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: docker
    # Prebuilt image with the apt packages, Flutter, Rust, the Android SDK and
    # Tuwunel (.vommet/ci/Dockerfile); the runner uses it locally (force_pull off).
    container:
      image: 100.64.0.13:3000/nether/vommet-ci:3.41.9-20261007
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Upstream's apt list (release.yml, Linux leg) in Debian/Ubuntu -dev
      # spelling, plus what the Rust side (flutter_rust_bridge via cargokit) needs.
      # lld + llvm: Flutter's native-assets build looks for ld.lld and llvm-ar next to clang
      # (/usr/lib/llvm-14/bin on this Ubuntu 22.04 image) and fails without it.
      - name: Install native build dependencies
        run: |
          if dpkg -s libgtk-3-dev clang >/dev/null 2>&1; then echo 'packages from the CI image'; exit 0; fi
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl xz-utils git unzip zip build-essential clang lld llvm cmake ninja-build pkg-config \
            libgtk-3-dev libmpv-dev mpv ffmpeg libmimalloc-dev libwebkit2gtk-4.1-dev \
            libasound2-dev libkeybinder-3.0-dev libglu1-mesa libstdc++-12-dev

      - name: Cache Flutter SDK, pub cache and Rust toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.cargo/registry
            ~/.cargo/git
          key: ci-image-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock', 'Cargo.lock') }}
          restore-keys: |
            ci-image-${{ env.FLUTTER_VERSION }}-

      # pub checks a git dependency's locked commit in its cached mirror before
      # fetching; a mirror older than that commit (restored from an older cache
      # via restore-keys) makes it silently drop the package's dependencies and
      # codegen fails on package_graph.json. Refresh the mirrors first.
      - name: Refresh cached git dependencies
        run: |
          for d in "$HOME"/.pub-cache/git/cache/*/; do
            [ -d "$d" ] || continue
            git --git-dir="$d" fetch --quiet --prune || rm -rf "$d"
          done

      - name: Install Flutter ${{ env.FLUTTER_VERSION }} (if not cached)
        run: |
          if [ ! -x "$HOME/flutter/bin/flutter" ]; then
            rm -rf "$HOME/flutter"
            curl -fsSL "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz" | tar -xJ -C "$HOME"
          fi
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          git config --global --add safe.directory '*'

      - name: Install Rust toolchain (if not cached)
        run: |
          if [ ! -x "$HOME/.cargo/bin/cargo" ]; then
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Configure Flutter
        run: |
          flutter config --no-analytics --enable-linux-desktop
          flutter --version
          cargo --version

      - name: Code generation
        run: |
          cd $PROJECT_PATH
          dart run scripts/codegen.dart

      - name: Build Linux (release, flatpak flavour)
        # Production GTK app id (im.nether.chat, not .develop): it must match
        # the Flatpak's desktop file for docks to show the icon.
        env:
          COMMET_PROD: 1
        run: |
          cd $PROJECT_PATH
          flutter build linux --release \
            --dart-define BUILD_MODE=release \
            --dart-define PLATFORM=linux \
            --dart-define GIT_HASH=${{ github.sha }} \
            --dart-define "VERSION_TAG=$(bash "$GITHUB_WORKSPACE/.vommet/ci/version-tag.sh" '${{ github.ref_name }}' '${{ github.run_number }}' 2>/dev/null || echo '${{ github.ref_name }}.${{ github.run_number }}')" \
            --dart-define BUILD_DETAIL=flatpak \
            --dart-define BUILD_DATE=$(date +%s000)

      - name: Package bundle
        run: |
          tar -C $PROJECT_PATH/build/linux/x64/release -czf vommet-linux-flatpak-bundle.tar.gz bundle
          ls -la vommet-linux-flatpak-bundle.tar.gz

      - name: Upload bundle
        uses: actions/upload-artifact@v3
        with:
          name: vommet-linux-flatpak-bundle
          path: vommet-linux-flatpak-bundle.tar.gz
          retention-days: 14
