name: nightly

# Forgejo only runs scheduled workflows from the default branch (main), so the
# nightly integration runs that live on testing (integration.yml, and
# integration-synapse.yml once that topic is promoted) never fired from their
# own `schedule:`. This starts them on testing every night instead. Their
# `live-host` concurrency group still runs them one at a time.
#
# 06:55 UTC (02:55 ET): the quietest slot between the 2-hourly sync cuts, and
# clear of the voice bridge's 08:30 UTC harness on the same runner. At 03:41
# the nightly kept landing on a cut's gate and delayed the next release (10-11).
on:
  schedule:
    - cron: '55 6 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-dispatch
  cancel-in-progress: false

env:
  API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
  # workflow or workflow:test-file (the integration workflow's target input).
  WORKFLOWS: integration.yml integration-synapse.yml integration.yml:integration_test/secure_setup_runner.dart
  # testing only ever moves to a commit that already passed the full suite as
  # the candidate, so the nightly full-suite run is skipped when testing's
  # commit has a green integration / linux, except on this weekday (1 = Monday,
  # 7 = Sunday), when it runs anyway as a flake probe. The nightly-only suites
  # (synapse, secure setup) always run.
  FLAKE_PROBE_DAY: 7

jobs:
  dispatch:
    runs-on: docker
    steps:
      - name: Install tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends curl ca-certificates jq >/dev/null

      # SYNC_TOKEN (a user token), not the job token: runs started with the
      # job token don't start further workflows.
      - name: Start the nightly runs on testing
        env:
          TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          list=$WORKFLOWS
          sha=$(curl -fsS -m 30 -H "Authorization: token $TOKEN" "$API/branches/testing" | jq -r '.commit.id // empty')
          if [ -n "$sha" ] && [ "$(date -u +%u)" != "$FLAKE_PROBE_DAY" ] && \
             curl -fsS -m 30 -H "Authorization: token $TOKEN" "$API/commits/$sha/statuses?limit=50" \
               | jq -e 'any(.[]; (.context | startswith("integration / linux (")) and .status == "success")' >/dev/null; then
            echo "testing ${sha:0:8} already passed the full integration suite; skipping that run"
            list=$(for e in $list; do [ "$e" = integration.yml ] || printf '%s ' "$e"; done)
          fi
          started=0
          for entry in $list; do
            wf=${entry%%:*}; target=${entry#*:}
            if [ "$target" = "$entry" ]; then body='{"ref":"testing"}'
            else body="{\"ref\":\"testing\",\"inputs\":{\"target\":\"$target\"}}"; fi
            code=$(curl -sS -o /tmp/resp -w '%{http_code}' -X POST \
              -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' \
              -d "$body" "$API/actions/workflows/$wf/dispatches")
            if [ "$code" -lt 300 ]; then
              echo "started $entry on testing"; started=$((started+1))
            else
              # A workflow that isn't on testing yet answers 404 or 500.
              echo "::warning::$wf not started (HTTP $code): $(head -c 300 /tmp/resp)"
            fi
          done
          [ "$started" -gt 0 ] || { echo "nothing started"; exit 1; }
