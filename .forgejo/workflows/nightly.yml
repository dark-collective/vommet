name: nightly

# The nightly integration suites on testing (full suite, secure setup, the
# Synapse UTD/unread-dot variants) run on the GitHub copy
# (.github/workflows/vommet-nightly.yml on ci/windows-release) since
# 2026-10-18; they used to be dispatched here as integration.yml and
# integration-synapse.yml runs, ~9 h a week on the main runner's single slot.
# This job pushes ci/windows-nightly = testing + that workflow (as the only
# file under .github/) + .vommet/ci/source-sha + .vommet/ci/nightly-targets;
# github-copy.yml copies it to GitHub. It then waits for the GitHub run and
# posts each job's result on testing's commit:
#   integration / linux (github nightly)          full suite
#   integration / secure-setup (github nightly)
#   integration-synapse / utd (github nightly)
# integration.yml and integration-synapse.yml stay on testing for manual
# dispatches.
#
# 06:55 UTC (02:55 ET): the quietest slot between the 2-hourly sync cuts.
on:
  schedule:
    - cron: '55 6 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-dispatch
  cancel-in-progress: false

env:
  API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
  SRC: ${{ github.server_url }}/${{ github.repository }}.git
  GH_API: https://api.github.com/repos/dark-collective/vommet
  TARGETS: full secure-setup synapse
  # testing only ever moves to a commit that already passed the full suite as
  # the candidate, so the nightly full-suite run is skipped when testing's
  # commit has a green integration / linux, except on this weekday (1 = Monday,
  # 7 = Sunday), when it runs anyway as a flake probe. The nightly-only suites
  # (synapse, secure setup) always run.
  FLAKE_PROBE_DAY: 7

jobs:
  dispatch:
    # Quick housekeeping: the 2-slot "light" runner (2026-10-12), so it never
    # waits behind builds in the main runner's single slot. It then mostly
    # sleeps while GitHub runs the suites.
    runs-on: light
    timeout-minutes: 150
    steps:
      - name: Install tools
        run: |
          command -v jq >/dev/null && exit 0
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends curl ca-certificates jq git >/dev/null

      # SYNC_TOKEN (a user token), not the job token: a push with the job
      # token doesn't start github-copy.yml.
      - name: Push ci/windows-nightly
        id: push
        shell: bash
        env:
          TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          fj() { curl -fsS -m 60 -H "Authorization: token $TOKEN" "$@"; }
          list=$TARGETS
          sha=$(fj "$API/branches/testing" | jq -r '.commit.id // empty')
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no testing commit"; exit 1; }
          if [ "$(date -u +%u)" != "$FLAKE_PROBE_DAY" ] && \
             fj "$API/commits/$sha/statuses?limit=50" \
               | jq -e 'any(.[]; (.context | startswith("integration / linux (")) and .status == "success")' >/dev/null; then
            echo "testing ${sha:0:8} already passed the full integration suite; skipping that run"
            list=$(for e in $list; do [ "$e" = full ] || printf '%s ' "$e"; done)
          fi
          git init -q w && cd w
          git fetch -q --depth=1 --no-tags "$SRC" +refs/heads/testing:refs/testing +refs/heads/ci/windows-release:refs/trusted
          [ "$(git rev-parse refs/testing)" = "$sha" ] || { echo "testing moved; using $(git rev-parse refs/testing)"; sha=$(git rev-parse refs/testing); }
          export GIT_INDEX_FILE=$PWD/.idx
          git read-tree "$sha"
          git rm -r -q --cached --ignore-unmatch .github
          add() { git update-index --add --cacheinfo "100644,$(printf '%s\n' "$2" | git hash-object -w --stdin),$1"; }
          git update-index --add --cacheinfo "100644,$(git rev-parse refs/trusted:.github/workflows/vommet-nightly.yml),.github/workflows/vommet-nightly.yml"
          add .vommet/ci/source-sha "$sha"
          add .vommet/ci/nightly-targets "$list"
          c=$(git -c user.name='Vommet nightly' -c user.email=nightly@nether.codes commit-tree "$(git write-tree)" -p "$sha" \
                -m "nightly: integration suites on GitHub for testing ${sha:0:10} ($list)")
          git push -q --force "https://x:${TOKEN}@${SRC#https://}" "$c:refs/heads/ci/windows-nightly"
          echo "pushed ci/windows-nightly ${c:0:8} for testing ${sha:0:8}: $list"
          { echo "testing=$sha"; echo "branch=$c"; echo "list=$list"; } >> "$GITHUB_OUTPUT"

      - name: Mirror the GitHub results onto testing
        shell: bash
        env:
          TOKEN: ${{ secrets.SYNC_TOKEN }}
          T: ${{ steps.push.outputs.testing }}
          W: ${{ steps.push.outputs.branch }}
        run: |
          set -uo pipefail
          declare -A CTX=(["integration (full)"]="integration / linux (github nightly)"
                          ["integration (secure-setup)"]="integration / secure-setup (github nightly)"
                          ["integration-synapse (utd)"]="integration-synapse / utd (github nightly)")
          post() {  # context state description url
            curl -fsS -m 60 -o /dev/null -X POST -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' \
              -d "$(jq -n --arg c "$1" --arg s "$2" --arg d "${3:0:240}" --arg u "$4" '{state:$s,context:$c,description:$d,target_url:$u}')" \
              "$API/statuses/$T" && echo "$1: $2 ($3)"
          }
          # The GitHub snapshot's message names the Forgejo commit (github-copy.yml).
          for i in $(seq 40); do
            sleep 180
            r=$(curl -fsS -m 60 "$GH_API/actions/runs?branch=ci/windows-nightly&per_page=10" 2>/dev/null \
              | jq -c --arg w "$W" '[.workflow_runs[]? | select(.name == "vommet-nightly" and (.head_commit.message | contains($w)))] | max_by(.id) // empty') || continue
            [ -n "$r" ] && [ "$(jq -r .status <<<"$r")" = completed ] && break
            r=""
          done
          if [ -z "$r" ]; then echo "::error::no finished vommet-nightly run for ${W:0:8} in time"; exit 1; fi
          id=$(jq -r .id <<<"$r"); echo "GitHub run $id: $(jq -r .conclusion <<<"$r")"
          rc=0
          while IFS=$'\t' read -r jid name concl url; do
            ctx=${CTX[$name]:-}; [ -n "$ctx" ] || continue
            case $concl in
              success) post "$ctx" success "GitHub run $id" "$url" ;;
              skipped) ;;
              *) why=$(curl -fsS -m 60 "$GH_API/check-runs/$jid/annotations" 2>/dev/null \
                   | jq -r '[.[] | select(.annotation_level == "failure" and (.message | startswith("Process completed") | not)) | .message][0] // ""' | head -3 | tr '\n' ' ')
                 post "$ctx" failure "GitHub run $id $concl${why:+: $why}" "$url"; rc=1 ;;
            esac
          done < <(curl -fsS -m 60 "$GH_API/actions/runs/$id/jobs" | jq -r '.jobs[] | [.id, .name, (.conclusion // "none"), .html_url] | @tsv')
          exit $rc
