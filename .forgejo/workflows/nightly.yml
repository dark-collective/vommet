name: nightly

# Forgejo only runs scheduled workflows from the default branch (main), so the
# nightly integration runs that live on testing (integration.yml, and
# integration-synapse.yml once that topic is promoted) never fired from their
# own `schedule:`. This starts them on testing every night instead. Their
# `live-host` concurrency group still runs them one at a time.
on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-dispatch
  cancel-in-progress: false

env:
  API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
  # workflow or workflow:test-file (the integration workflow's target input).
  WORKFLOWS: integration.yml integration-synapse.yml integration.yml:integration_test/secure_setup_runner.dart

jobs:
  dispatch:
    runs-on: docker
    steps:
      - name: Install tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends curl ca-certificates >/dev/null

      # SYNC_TOKEN (a user token), not the job token: runs started with the
      # job token don't start further workflows.
      - name: Start the nightly runs on testing
        env:
          TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          started=0
          for entry in $WORKFLOWS; do
            wf=${entry%%:*}; target=${entry#*:}
            if [ "$target" = "$entry" ]; then body='{"ref":"testing"}'
            else body="{\"ref\":\"testing\",\"inputs\":{\"target\":\"$target\"}}"; fi
            code=$(curl -sS -o /tmp/resp -w '%{http_code}' -X POST \
              -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' \
              -d "$body" "$API/actions/workflows/$wf/dispatches")
            if [ "$code" -lt 300 ]; then
              echo "started $entry on testing"; started=$((started+1))
            else
              # A workflow that isn't on testing yet answers 404 or 500.
              echo "::warning::$wf not started (HTTP $code): $(head -c 300 /tmp/resp)"
            fi
          done
          [ "$started" -gt 0 ] || { echo "nothing started"; exit 1; }
