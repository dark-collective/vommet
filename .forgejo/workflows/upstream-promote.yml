name: upstream-promote

# Move main, every topic and testing to the sync/* candidates. Refuses unless
# CI is green on sync/main and sync/testing and nobody pushed to a published
# branch since the candidates were cut. Old tips are tagged pre-sync/<stamp>/*.
on:
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}

jobs:
  promote:
    # Quick housekeeping: the 2-slot "light" runner (2026-10-12), so it never
    # waits behind builds in the main runner's single slot.
    runs-on: light
    steps:
      - name: Install tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git jq curl ca-certificates >/dev/null

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          # Shallow and tagless: a full checkout also fetched every pre-sync/*
          # rollback tag (78k by 2026-11), and two promotes were lost there.
          fetch-depth: 1
          token: ${{ secrets.SYNC_TOKEN }}

      # Forgejo over the tailnet when it answers there: Cloudflare's 100 s cap made the
      # promote's ~1000-ref push return 524 (2026-11-05). See .vommet/ci/forgejo-tailnet.sh.
      - name: Forgejo over the tailnet
        id: forgejo
        run: .vommet/ci/forgejo-tailnet.sh --git

      - name: Fetch branch history (no tags)
        run: |
          git config remote.origin.tagOpt --no-tags
          git fetch --quiet --unshallow origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Promote
        id: promote
        env:
          FORGEJO_API: ${{ steps.forgejo.outputs.api || env.API }}
          FORGEJO_TOKEN: ${{ secrets.SYNC_TOKEN }}
          # About 6,000 rollback tags a day; 3 days keeps tag listings on nether.codes cheap.
          PRE_SYNC_KEEP_DAYS: 3
        run: .vommet/sync.sh promote

      - name: Close the sync issue
        env:
          API: ${{ steps.forgejo.outputs.api || env.API }}
          TOKEN: ${{ secrets.SYNC_TOKEN }}
          STAMP: ${{ steps.promote.outputs.stamp }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
        run: .vommet/report-issue.sh promoted
