[package]
name = "rust_lib_commet"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

# Vommet: voice message transcription on Android (Vommet issue 70, phase 2);
# same crates and versions as the desktop section further down.
[target.'cfg(target_os = "android")'.dependencies]
whisper-rs = { version = "0.16.0", default-features = false }
opus = { version = "0.4.0", default-features = false }
symphonia = { version = "0.6.1", default-features = false, features = ["ogg", "mkv", "isomp4", "wav", "aac", "mp3", "vorbis", "flac", "pcm"] }

[dependencies]
base64 = "0.22.1"
bytes = "1.11.1"
encoding_rs = "0.8.35"
flutter_rust_bridge = "=2.11.1"
hex = "0.4.3"
image = "0.25.10"
lazy_static = "1.5.0"
log = "0.4.29"
once_cell = "1.21.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
spellbook = "=0.4.2"
stderrlog = "0.6.0"
tao = "0.34.6"
tokio = { version = "1.50.0", features = ["io-util", "io-std"] }
uuid = "1.23.0"
vommet_voice = { path = "../voice" }
wry = "0.54.4"
anyhow = "1.0.102"

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
vommet_blur = { path = "../blur" }
overlay = { git = "https://github.com/commetchat/overlay.git", rev = "e0b4d4402ddcffb66829b78f900ccd7bf43a8d9d" }

# Vommet: on-device voice message transcription (#70). Desktop only for now;
# Android (phase 2) doesn't load this library yet.
[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.16.0", default-features = false }
opus = { version = "0.4.0", default-features = false }
symphonia = { version = "0.6.1", default-features = false, features = ["ogg", "mkv", "isomp4", "wav", "aac", "mp3", "vorbis", "flac", "pcm"] }

# Vommet: only the desktop widget runner uses it; keeping it off Android saves
# that build a WebRTC stack (the library builds there for transcription).
[target.'cfg(all(unix, not(target_os = "android")))'.dependencies]
webrtc = "0.17.1"

# Vommet: WebRTC + media permissions for the Linux widget runner (same
# versions wry already pulls in).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# Vommet: the camera blur runs a segmentation model on the camera's frames;
# unoptimized it's too slow to use, so debug builds optimize it too.
[profile.dev.package.vommet_blur]
opt-level = 3
