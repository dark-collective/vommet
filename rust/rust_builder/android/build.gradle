// The Android Gradle Plugin builds the native code with the Android NDK.

group 'com.flutter_rust_bridge.rust_lib_commet'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        classpath 'com.android.tools.build:gradle:7.3.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.flutter_rust_bridge.rust_lib_commet'
    }

    // Bumping the plugin compileSdkVersion requires all clients of this plugin
    // to bump the version in their app.
    compileSdkVersion 33

    // Use the NDK version
    // declared in /android/app/build.gradle file of the Flutter project.
    // Replace it with a version number if this plugin requires a specfic NDK version.
    // (e.g. ndkVersion "23.1.7779620")
    ndkVersion android.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 19
    }
}

// Vommet: built on Android again (upstream turned it off), for on-device voice
// message transcription (Vommet issue 70). Loaded only when it's first used.
apply from: "../cargokit/gradle/plugin.gradle"
cargokit {
    manifestDir = "../../rust"
    libname = "rust_lib_commet"
}

// Vommet: whisper.cpp (and libopus) link the NDK's shared C++ runtime, which
// no other plugin ships, so without this the library fails to load on the
// device. The app's packagingOptions pickFirst any second copy.
def cppSharedDir = new File(buildDir, "vommet-cpp-shared")
android.sourceSets.main.jniLibs.srcDirs += cppSharedDir
task copyCppShared {
    outputs.dir cppSharedDir
    doLast {
        def prebuilt = ["linux-x86_64", "darwin-x86_64", "windows-x86_64"]
            .collect { new File(android.ndkDirectory, "toolchains/llvm/prebuilt/$it") }
            .find { it.exists() }
        if (prebuilt == null) {
            throw new GradleException("NDK toolchain not found under ${android.ndkDirectory}")
        }
        ["arm64-v8a": "aarch64-linux-android", "armeabi-v7a": "arm-linux-androideabi",
         "x86_64": "x86_64-linux-android", "x86": "i686-linux-android"].each { abi, triple ->
            copy {
                from new File(prebuilt, "sysroot/usr/lib/$triple/libc++_shared.so")
                into new File(cppSharedDir, abi)
            }
        }
    }
}
preBuild.dependsOn copyCppShared
