name: vommet_hinge
description: >-
  Hinge state of foldable iPhones (UIHingeInteraction, iOS 27.1+) for Vommet,
  so the layout can keep content off the fold. Other platforms report nothing.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: VommetHingePlugin
