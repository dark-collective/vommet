# Vommet: integration tests (Flutter integration_test on the Linux desktop app
# against a throwaway Tuwunel homeserver at https://localhost, under Xvfb, with
# a screen recording) for the testing candidate. Runs only on the GitHub copy
# (github.com/dark-collective/vommet); replaces Forgejo's integration.yml for
# sync/testing (2026-10-11, Phase 3 of moving release builds off the
# single-slot Forgejo runner).
#
# Security model (operator 10-11: "without us getting hacked"):
# - Self-contained. The homeserver is started inside this job on 127.0.0.1 with
#   a fresh self-signed CA and made-up users (.vommet/it/homeserver.sh); the job
#   never connects to nether.im, the tailnet or any host of ours, and nothing
#   of ours accepts connections from GitHub. Results flow back only because
#   our sync tooling (ghgate.sh) polls GitHub's public API.
# - No secrets, read-only token (permissions: contents: read), no release.
# - Pinned inputs: actions by commit SHA, the job image by digest (the public
#   catthehacker act-22.04 image the Forgejo CI image is built FROM), Tuwunel by
#   version AND sha256.
# - Runs only on pushes of our own branches (github-copy.yml is the only
#   writer) and of ci-prit-* tags (pr-github.yml is the only writer, for PRs of
#   listed authors); never on pull_request, so outside forks can't trigger it.
# - The artifact (screen recording + logs) shows only the throwaway test
#   accounts; GitHub keeps it 14 days, visible to logged-in GitHub users.
name: vommet-integration

on:
  push:
    branches: ['ci/windows-testing', 'ci/windows-it*']
    # PR copies made by .forgejo/workflows/pr-github.yml on main (2026-11-04): a parentless snapshot of a
    # PR head from an author in .vommet/ci/integration-pr-authors, .github/ = this file only, pushed by
    # that job as the TAG ci-prit-<n> (tags, because github-copy.yml prunes unknown branches).
    tags: ['ci-prit-*']
  workflow_dispatch:
    inputs:
      target:
        description: 'Test file under commet/ (default: integration_test/vommet_runner.dart)'
        default: 'integration_test/vommet_runner.dart'

permissions:
  contents: read

concurrency:
  group: vommet-integration-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.41.9
  PROJECT_PATH: commet
  TUWUNEL_VERSION: v1.9.3
  TUWUNEL_SHA256: 98c3b0be352cc03b2c6b21d6f2ed60fedc926f4aab61ce37f0b89eed97d5b756

jobs:
  # The suite runs as parallel shards, each a fresh job (own homeserver, own build), split by test
  # name (run.sh IT_NAME = flutter test --name). One run took ~55 min on 11-05 (tests 38 min, 25 of
  # them in the sliding sync gap / clear cache / UTD tests). Since then (operator 11-05) five of the
  # sliding sync gap variants (six tests) run only nightly (.vommet/it/nightly-only, vommet-nightly.yml
  # target "sync-gap"), and the rest splits in two shards of ~12-15 min of tests. Shard 2 is
  # everything shard 1 doesn't match, so a new test always runs somewhere. Rebalance with the
  # per-test times in a job log ("MM:SS +N: <test>" lines).
  linux:
    if: github.repository == 'dark-collective/vommet'
    name: linux (${{ matrix.shard }}/2)
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # Root inside the container: homeserver.sh binds port 443 and installs its
    # throwaway CA, as in the Forgejo job.
    container:
      image: ghcr.io/catthehacker/ubuntu@sha256:f5f5c29208c4fd541704fe7b8df33d3bf620ce4ac46f36853b7abeb0159705c4
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The Forgejo CI image's apt list (.vommet/ci/Dockerfile), test tools included.
      # Which tests this shard runs. Shard 1 takes named groups, shard 2 the rest (a negative
      # lookahead on the same names), so every test runs exactly once; both leave out the tests in
      # .vommet/it/nightly-only (the nightly "sync-gap" target runs those; one list for both
      # workflows). A dispatched other target runs whole in shard 1, and shard 2 skips every step.
      # A PR copy (ci-prit-* tag) of a tree from before the split (PR on an older testing base;
      # 11-05 those ran all 51 tests in shard 1, ~55 min) is split too: its run.sh gets the same
      # IT_NAME lines as a397ac338a0, and the nightly-only list is the copy below (that tree has
      # none). Candidate and pre-gate runs of such trees, and a run.sh this patch doesn't
      # recognise, still run whole in shard 1.
      - name: Plan shard
        id: plan
        env:
          TARGET: ${{ inputs.target || 'integration_test/vommet_runner.dart' }}
          SHARD: ${{ matrix.shard }}
        run: |
          s1='sliding sync gap|clear cache|UTD vanish|unread two devices'
          # = .vommet/it/nightly-only on testing (11-05); used only by trees without that file.
          nightly_default='sliding sync gap: (silent|post|encrypted own|own below newer|failed echo)'
          r=.vommet/it/run.sh no=
          if [ "$TARGET" = integration_test/vommet_runner.dart ] && [ "$GITHUB_REF_TYPE" = tag ] && [ -f $r ] && ! grep -q IT_NAME $r \
            && grep -q '^export TARGET OUT$' $r && grep -q '^  flutter test "$TARGET" -d linux -r expanded \\$' $r; then
            perl -pi -e 's/^export TARGET OUT$/export TARGET OUT IT_NAME=\$\{IT_NAME:-\}/;
              s/^(  flutter test "\$TARGET" -d linux -r expanded) \\$/$1 \$\{IT_NAME:+--name "\$IT_NAME"\} \\/' $r
            grep -c IT_NAME $r | grep -qx 2 || { echo "::error title=integration shard plan::run.sh IT_NAME patch did not apply"; exit 1; }
            [ -e .vommet/it/nightly-only ] || no=$nightly_default
            echo "::notice title=integration shard $SHARD::older tree: run.sh patched for IT_NAME, nightly-only from the workflow"
          fi
          if [ "$TARGET" = integration_test/vommet_runner.dart ] && grep -q IT_NAME $r 2>/dev/null; then
            [ -n "$no" ] || no=$(head -1 .vommet/it/nightly-only 2>/dev/null || true)
            case $SHARD in
              1) n="^(?!$no)($s1)"; [ -n "$no" ] || n="^($s1)";;
              2) n="^(?!$s1)";;
            esac
          elif [ "$SHARD" = 1 ]; then n=
          else echo "::notice title=integration shard $SHARD::not split (other target or a tree from before the split); shard 1 runs it all"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "shard $SHARD/2: IT_NAME=${n:-<all>}"
          { echo "run=true"; echo "it_name=$n"; } >> "$GITHUB_OUTPUT"

      - name: Install native build and test dependencies
        if: steps.plan.outputs.run == 'true'
        run: |
          # A stalled mirror fails fast and retries instead of eating the job's time limit
          # (2026-10-22: a silent 42-min apt hang ran vommet-linux into its 60-min limit).
          # Each try fetches the lists and the packages under a watchdog, and a retry first moves
          # to another mirror: the runner's default Ubuntu mirror stalled all 3 tries twice on
          # 10-22/23 (vommet-native). The install itself then runs from the local cache.
          # The watchdog runs INSIDE sudo (sudo timeout, not timeout sudo): signals from timeout never
          # reached apt-get through sudo, so a stalled try ran 45-50 min (10-23, 10-26, 10-27 timeouts).
          su=; [ "$(id -u)" = 0 ] || su=sudo
          mirror() {
            local m re
            . /etc/os-release
            case $ID in
              ubuntu) [ "$(dpkg --print-architecture)" = amd64 ] || return 0
                      re='https?://(?:(?:azure\.)?archive\.ubuntu\.com|mirrors\.edge\.kernel\.org)/ubuntu/?'
                      m=http://archive.ubuntu.com/ubuntu/; [ $1 = 2 ] && m=http://mirrors.edge.kernel.org/ubuntu/;;
              debian) re='https?://(?:deb\.debian\.org|ftp\.us\.debian\.org|mirrors\.edge\.kernel\.org)/debian/?'
                      m=http://mirrors.edge.kernel.org/debian/; [ $1 = 2 ] && m=http://ftp.us.debian.org/debian/;;
              *) return 0;;
            esac
            echo "apt: switching to $m"
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              { printf '%s\tpriority:1\n' "$m"; awk -F'priority:' 'NF==2{print $1 "priority:" $2+1; next} {print}' /etc/apt/apt-mirrors.txt; } > mirrors.new
              $su cp mirrors.new /etc/apt/apt-mirrors.txt; rm mirrors.new
            fi
            for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
              [ -f "$f" ] && $su perl -pi -e 's#'"$re"'(?=\s|$)#'"$m"'#g' "$f"
            done
            return 0
          }
          o="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          p="\
            ca-certificates curl xz-utils git unzip zip build-essential clang lld llvm cmake ninja-build pkg-config \
            libgtk-3-dev libmpv-dev mpv ffmpeg libmimalloc-dev libwebkit2gtk-4.1-dev \
            libasound2-dev libkeybinder-3.0-dev libglu1-mesa libstdc++-12-dev libsecret-1-dev libjsoncpp-dev libpulse-dev \
            xvfb jq openssl zstd dbus dbus-x11 gnome-keyring dunst"
          for i in 1 2 3; do
            [ $i = 1 ] || mirror $i
            $su timeout -k 20 150 apt-get $o update -qq &&
              $su timeout -k 20 360 apt-get $o install -y -qq --download-only --no-install-recommends $p >/dev/null && break
            [ $i = 3 ] && { echo "::error title=apt::package download failed or stalled 3 times"; exit 1; }
            $su pkill -KILL -f '^/usr/lib/apt/methods/' 2>/dev/null || true
            echo "::warning title=apt::try $i failed or stalled"; sleep 10
          done
          $su apt-get install -y -qq --no-install-recommends $p >/dev/null
          git config --global --add safe.directory '*'

      - name: Setup Flutter
        if: steps.plan.outputs.run == 'true'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache cargo
        if: steps.plan.outputs.run == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: it-cargo-${{ hashFiles('**/Cargo.lock', '**/pubspec.lock') }}
          restore-keys: it-cargo-

      - name: Install Rust and Tuwunel
        if: steps.plan.outputs.run == 'true'
        run: |
          if [ ! -x "$HOME/.cargo/bin/cargo" ]; then
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          tw="$HOME/tuwunel-$TUWUNEL_VERSION"
          curl -fsSL -o tw.zst "https://github.com/matrix-construct/tuwunel/releases/download/$TUWUNEL_VERSION/$TUWUNEL_VERSION-release-all-x86_64-v1-linux-gnu-tuwunel.zst"
          echo "$TUWUNEL_SHA256  tw.zst" | sha256sum -c -
          zstd -q -d tw.zst -o "$tw" && rm tw.zst && chmod +x "$tw"
          echo "TUWUNEL=$tw" >> "$GITHUB_ENV"

      - name: Configure Flutter and generate code
        if: steps.plan.outputs.run == 'true'
        run: |
          flutter config --no-analytics --enable-linux-desktop
          cd $PROJECT_PATH
          flutter pub get
          dart run scripts/codegen.dart

      - name: Integration tests
        if: steps.plan.outputs.run == 'true'
        env:
          TARGET: ${{ inputs.target || 'integration_test/vommet_runner.dart' }}
          SHARD: ${{ matrix.shard }}
          PLAN_IT_NAME: ${{ steps.plan.outputs.it_name }}
        run: |
          set -o pipefail
          export IT_NAME=$PLAN_IT_NAME
          start=$(date +%s)
          .vommet/it/run.sh "$TARGET" || {
            rc=$?
            # A shard whose names match nothing (tests renamed): say so, don't fail the gate.
            if [ $rc = 79 ] || grep -q 'No tests match' it-out/flutter-test.log 2>/dev/null; then
              echo "::warning title=integration shard $SHARD matched no tests::rebalance the shard names in vommet-integration.yml (Plan shard)"; exit 0; fi
            # Failing tests ("[E]" in the expanded reporter) as an annotation:
            # readable without a GitHub login, unlike the raw log.
            msg=$(grep -E '\[E\]$' it-out/flutter-test.log 2>/dev/null | sed -E 's/^[0-9:+ -]+//' | sort -u | tail -n 40)
            [ -n "$msg" ] || msg=$(tail -n 40 it-out/flutter-test.log 2>/dev/null)
            msg=${msg//'%'/'%25'}; msg=${msg//$'\r'/'%0D'}; msg=${msg//$'\n'/'%0A'}
            echo "::error title=integration tests failed (shard $SHARD/2)::$msg"
            exit $rc; }
          # The pass count, public like the failure annotation, to compare runs.
          echo "::notice title=integration tests passed (shard $SHARD/2)::$(grep -E '^[0-9:]+ \+[0-9]+.*All tests passed' it-out/flutter-test.log | tail -1)"
          # Time guard (11-05: the suite doubled in 3 days unnoticed); test-health.py also checks run times.
          min=$(( ($(date +%s) - start) / 60 ))
          [ $min -lt ${IT_SLOW_MIN:-30} ] || echo "::warning title=integration shard slow::shard $SHARD/2 took $min min (build + tests); move heavy tests to the nightly suite or rebalance the shards"

      - name: Upload screen recording and logs
        if: always() && steps.plan.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-${{ github.run_number }}-${{ matrix.shard }}
          path: it-out/
          retention-days: 14
