# Vommet: the nightly integration suites on testing, on the GitHub copy
# (github.com/dark-collective/vommet). Replaces the Forgejo runs nightly.yml
# used to dispatch on testing (integration.yml full suite + secure setup,
# integration-synapse.yml; ~9 h a week on the single-slot Forgejo runner,
# 2026-10-18).
#
# Forgejo's nightly.yml (light runner, 06:55 UTC) pushes ci/windows-nightly =
# testing + this file + .vommet/ci/source-sha (testing's sha) +
# .vommet/ci/nightly-targets (what to run tonight: "full" unless testing
# already passed the full suite, "secure-setup", "synapse"); github-copy.yml
# copies it here. nightly.yml then waits for this run and posts each job's
# result on testing as a Forgejo status ("... (github nightly)").
#
# Security model: as vommet-integration.yml. Self-contained (throwaway
# Tuwunel/Synapse on 127.0.0.1, own CA, made-up users; never connects to our
# hosts), no secrets, contents: read, actions pinned by SHA, image by digest,
# Tuwunel by version + sha256, Synapse by PyPI version. Push-only trigger on
# our own branch.
name: vommet-nightly

on:
  push:
    branches: ['ci/windows-nightly']

permissions:
  contents: read

concurrency:
  group: vommet-nightly
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.41.9
  PROJECT_PATH: commet
  TUWUNEL_VERSION: v1.9.3
  TUWUNEL_SHA256: 98c3b0be352cc03b2c6b21d6f2ed60fedc926f4aab61ce37f0b89eed97d5b756
  # Pinned like Tuwunel; 1.162 still supports the image's Python 3.10.
  SYNAPSE_VERSION: 1.162.0

jobs:
  plan:
    if: github.repository == 'dark-collective/vommet'
    runs-on: ubuntu-22.04
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
      synapse: ${{ steps.plan.outputs.synapse }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: plan
        run: |
          want=$(cat .vommet/ci/nightly-targets 2>/dev/null || echo "full secure-setup synapse")
          t=()
          for w in $want; do case $w in
            full) t+=('{"name":"full","file":"integration_test/vommet_runner.dart"}') ;;
            secure-setup) t+=('{"name":"secure-setup","file":"integration_test/secure_setup_runner.dart"}') ;;
          esac; done
          echo "targets=[$(IFS=,; echo "${t[*]}")]" >> "$GITHUB_OUTPUT"
          [[ " $want " == *" synapse "* ]] && echo "synapse=true" >> "$GITHUB_OUTPUT" || echo "synapse=false" >> "$GITHUB_OUTPUT"
          echo "tonight: $want (testing $(cat .vommet/ci/source-sha 2>/dev/null))"

  integration:
    needs: plan
    if: needs.plan.outputs.targets != '[]'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    name: integration (${{ matrix.target.name }})
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    # Root inside the container: homeserver.sh binds port 443 and installs its
    # throwaway CA, as in the Forgejo job.
    container:
      image: ghcr.io/catthehacker/ubuntu@sha256:f5f5c29208c4fd541704fe7b8df33d3bf620ce4ac46f36853b7abeb0159705c4
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install native build and test dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl xz-utils git unzip zip build-essential clang lld llvm cmake ninja-build pkg-config \
            libgtk-3-dev libmpv-dev mpv ffmpeg libmimalloc-dev libwebkit2gtk-4.1-dev \
            libasound2-dev libkeybinder-3.0-dev libglu1-mesa libstdc++-12-dev libsecret-1-dev libjsoncpp-dev libpulse-dev \
            libpipewire-0.3-dev xvfb jq openssl zstd dbus dbus-x11 gnome-keyring dunst >/dev/null
          git config --global --add safe.directory '*'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: it-cargo-${{ hashFiles('**/Cargo.lock', '**/pubspec.lock') }}
          restore-keys: it-cargo-

      - name: Install Rust and Tuwunel
        run: |
          if [ ! -x "$HOME/.cargo/bin/cargo" ]; then
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          tw="$HOME/tuwunel-$TUWUNEL_VERSION"
          curl -fsSL -o tw.zst "https://github.com/matrix-construct/tuwunel/releases/download/$TUWUNEL_VERSION/$TUWUNEL_VERSION-release-all-x86_64-v1-linux-gnu-tuwunel.zst"
          echo "$TUWUNEL_SHA256  tw.zst" | sha256sum -c -
          zstd -q -d tw.zst -o "$tw" && rm tw.zst && chmod +x "$tw"
          echo "TUWUNEL=$tw" >> "$GITHUB_ENV"

      - name: Configure Flutter and generate code
        run: |
          flutter config --no-analytics --enable-linux-desktop
          cd $PROJECT_PATH
          flutter pub get
          dart run scripts/codegen.dart

      - name: Integration tests
        env:
          TARGET: ${{ matrix.target.file }}
          NAME: ${{ matrix.target.name }}
        run: |
          set -o pipefail
          .vommet/it/run.sh "$TARGET" || {
            rc=$?
            # Failing tests ("[E]" in the expanded reporter) as an annotation:
            # readable without a GitHub login, unlike the raw log.
            msg=$(grep -E '\[E\]$' it-out/flutter-test.log 2>/dev/null | sed -E 's/^[0-9:+ -]+//' | sort -u | tail -n 40)
            [ -n "$msg" ] || msg=$(tail -n 40 it-out/flutter-test.log 2>/dev/null)
            msg=${msg//'%'/'%25'}; msg=${msg//$'\r'/'%0D'}; msg=${msg//$'\n'/'%0A'}
            echo "::error title=integration ($NAME) failed::$msg"
            exit $rc; }
          # The pass count, public like the failure annotation, to compare runs.
          echo "::notice title=integration ($NAME) passed::$(grep -E '^[0-9:]+ \+[0-9]+.*All tests passed' it-out/flutter-test.log | tail -1)"

      - name: Upload screen recording and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-${{ matrix.target.name }}-${{ github.run_number }}
          path: it-out/
          retention-days: 7

  # integration-synapse.yml's "utd" job: the "Retry Decrypt" / history-gap
  # variants of utd_vanish_test.dart and every unread-dot variant against
  # Synapse (in the job container, from PyPI) with a second Tuwunel.
  synapse:
    needs: plan
    if: needs.plan.outputs.synapse == 'true'
    name: integration-synapse (utd)
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    container:
      image: ghcr.io/catthehacker/ubuntu@sha256:f5f5c29208c4fd541704fe7b8df33d3bf620ce4ac46f36853b7abeb0159705c4
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install native build and test dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl xz-utils git unzip zip build-essential clang lld llvm cmake ninja-build pkg-config \
            libgtk-3-dev libmpv-dev mpv ffmpeg libmimalloc-dev libwebkit2gtk-4.1-dev \
            libasound2-dev libkeybinder-3.0-dev libglu1-mesa libstdc++-12-dev libsecret-1-dev libjsoncpp-dev libpulse-dev \
            libpipewire-0.3-dev xvfb jq openssl zstd dbus dbus-x11 gnome-keyring dunst python3 python3-venv >/dev/null
          git config --global --add safe.directory '*'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache cargo and the Synapse venv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/synapse-venv-${{ env.SYNAPSE_VERSION }}
          key: it-synapse-${{ env.SYNAPSE_VERSION }}-${{ hashFiles('**/Cargo.lock', '**/pubspec.lock') }}
          restore-keys: it-synapse-${{ env.SYNAPSE_VERSION }}-

      - name: Install Rust and Tuwunel
        run: |
          if [ ! -x "$HOME/.cargo/bin/cargo" ]; then
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          tw="$HOME/tuwunel-$TUWUNEL_VERSION"
          curl -fsSL -o tw.zst "https://github.com/matrix-construct/tuwunel/releases/download/$TUWUNEL_VERSION/$TUWUNEL_VERSION-release-all-x86_64-v1-linux-gnu-tuwunel.zst"
          echo "$TUWUNEL_SHA256  tw.zst" | sha256sum -c -
          zstd -q -d tw.zst -o "$tw" && rm tw.zst && chmod +x "$tw"
          echo "TUWUNEL=$tw" >> "$GITHUB_ENV"

      - name: Configure Flutter and generate code
        run: |
          flutter config --no-analytics --enable-linux-desktop
          cd $PROJECT_PATH
          flutter pub get
          dart run scripts/codegen.dart

      - name: Annotation helper
        run: |
          mkdir -p "$HOME/bin"
          cat > "$HOME/bin/it_report" <<'SH'
          #!/usr/bin/env bash
          # it_report <title> <log> <exit code>: failing tests or the pass count as an annotation.
          title=$1 log=$2 rc=$3
          if [ "$rc" != 0 ]; then
            msg=$(grep -E '\[E\]$' "$log" 2>/dev/null | sed -E 's/^[0-9:+ -]+//' | sort -u | tail -n 40)
            [ -n "$msg" ] || msg=$(tail -n 40 "$log" 2>/dev/null)
            msg=${msg//'%'/'%25'}; msg=${msg//$'\r'/'%0D'}; msg=${msg//$'\n'/'%0A'}
            echo "::error title=$title failed::$msg"
          else
            echo "::notice title=$title passed::$(grep -E '^[0-9:]+ \+[0-9]+.*All tests passed' "$log" | tail -1)"
          fi
          exit "$rc"
          SH
          chmod +x "$HOME/bin/it_report"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      # A on a second Tuwunel (127.0.0.1:8449), B and the app on Synapse.
      - name: UTD variants against Synapse
        env:
          IT_HS: synapse
          IT_FEDERATION: '1'
          UTD_ONLY: 'federated:'
          UTD_REPEAT: '1'
        run: |
          .vommet/it/run.sh integration_test/utd_vanish_runner.dart; rc=$?
          it_report "synapse utd" it-out/flutter-test.log $rc

      # Every unread-dot variant, the app and the sender on Synapse.
      - name: Unread dot variants against Synapse
        if: always()
        env:
          IT_HS: synapse
          OUT: ${{ github.workspace }}/it-out/unread-dot
          # Its own Synapse: the UTD step's database already has alice and bob.
          WORK: /tmp/vommet-it-unread
        run: |
          .vommet/it/run.sh integration_test/unread_dot_runner.dart; rc=$?
          it_report "synapse unread dot" "$OUT/flutter-test.log" $rc

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-synapse-${{ github.run_number }}
          path: it-out/
          retention-days: 7
