# Vommet: temporary smoke check for the Windows widget dock (feat/widget-dock-windows).
# Builds integration_test/widget_dock_probe.dart as a release app, runs it, and
# captures the screen while it holds docked / popped out / docked back.
name: vommet-dock-windows

on:
  push:
    branches: ['ci/windows-dockwin*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vommet-dock-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dock-smoke:
    if: github.repository != 'commetchat/commet'
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: dock-windows-${{ hashFiles('Cargo.lock', 'commet/pubspec.lock') }}
          restore-keys: |
            dock-windows-
            smoke-windows-

      - name: Code generation
        run: |
          flutter config --no-analytics --enable-windows-desktop
          git config --global core.longpaths true
          cd .\commet
          flutter pub get
          dart run scripts/codegen.dart

      - name: Build the probe
        run: |
          cd .\commet
          # Release: the debug build's Rust link fails on MSVC (LNK1201), and
          # flutter test has no release mode for desktop.
          flutter build windows --release -t integration_test/widget_dock_probe.dart

      - name: Dock smoke check
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "dock-out"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $env:DOCK_SMOKE_OUT = $out
          # The probe writes dock-out/holding (the state's name) while it holds
          # a state; capture the screen meanwhile.
          $shots = Start-Job -ArgumentList $out -ScriptBlock {
            param($dir)
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $marker = Join-Path $dir "holding"
            $n = 0
            for ($i = 0; $i -lt 2400 -and $n -lt 30; $i++) {
              if (Test-Path $marker) {
                $state = Get-Content $marker -ErrorAction SilentlyContinue
                $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
                $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
                $g = [System.Drawing.Graphics]::FromImage($bmp)
                $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
                $bmp.Save((Join-Path $dir ("shot-{0:D2}-{1}.png" -f $n, $state)))
                $g.Dispose(); $bmp.Dispose()
                $n++
                Start-Sleep -Milliseconds 1500
              } else {
                Start-Sleep -Milliseconds 250
              }
            }
          }
          $exe = (Get-ChildItem "commet\build\windows\x64\runner\Release\*.exe" | Select-Object -First 1).FullName
          $probe = Start-Process -FilePath $exe -PassThru
          $null = $probe.Handle
          if (-not $probe.WaitForExit(240000)) {
            Stop-Process -Id $probe.Id -Force
            Add-Content -Path (Join-Path $out "dock-smoke.txt") -Value "DOCK-SMOKE FAIL probe timed out"
          }
          Start-Sleep -Seconds 2
          Stop-Job $shots; Receive-Job $shots; Remove-Job $shots -Force
          Get-ChildItem $out
          $res = Get-Content (Join-Path $out "dock-smoke.txt") -ErrorAction SilentlyContinue
          $res | Write-Host
          # Annotations are readable without a token.
          $enc = ($res -join "`n").Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
          Write-Host "::notice title=Dock smoke::$enc"
          if (-not ($res -match "DOCK-SMOKE PASS")) { exit 1 }

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dock-windows-${{ github.run_number }}
          path: dock-out/
          retention-days: 14
